<div class="admin-layout">
  <app-sidebar></app-sidebar>
  <main class="admin-conteudo">
    <header class="admin-cabecalho">
      <div>
        <h1>
          Atualizar produtos
        </h1>
        <p *ngIf="listarProduto">
          Escolha um produto para editar
        </p>
        <p *ngIf="!listarProduto">
          Editando {{ null==dataId?null:dataId.nome }}
        </p>
      </div>
      <button class="uz-btn-vazado" type="button" (click)="voltarParaListar()" *ngIf="!listarProduto">
        Voltar para a lista
      </button>
    </header>
    <section class="admin-card">
      <ng-container *ngIf="listarProduto">
        <p class="admin-vazio" *ngIf="0===data.length">
          Nenhum produto cadastrado ainda.
        </p>
        <div class="grade-produtos" *ngIf="data.length>0">
          <button class="card-produto" type="button" (click)="AlterarProdutoClicado(item.id)" *ngFor="let item of data">
            <img [src]="item.fotoUrls[0]" [alt]="item.nome">
            <div class="info">
              <span class="nome">
                {{ item.nome }}
              </span>
              <span class="preco">
                {{ item.preco | currency:'BRL':'symbol' }}
              </span>
            </div>
          </button>
        </div>
      </ng-container>
      <form class="admin-form" [formGroup]="criarProduto" *ngIf="!listarProduto&&!enviarFoto">
        <button class="abrir-fotos" type="button" (click)="trocarParaOEnviarImagem()">
          <span class="icone" aria-hidden="true">
            +
          </span>
          <span>
            <strong>
              {{ 3===contadorFiles?'3 fotos selecionadas':'Substituir fotos' }}
            </strong>
            <span>
              São necessárias exatamente três imagens
            </span>
          </span>
        </button>
        <div class="admin-campo">
          <label class="uz-rotulo" for="nome">
            Nome do produto
          </label>
          <input class="uz-campo" id="nome" type="text" formControlName="Nome" [placeholder]="(null==dataId?null:dataId.nome)||''">
        </div>
        <div class="admin-campo">
          <label class="uz-rotulo" for="preco">
            Preço de venda
          </label>
          <input class="uz-campo" id="preco" type="number" formControlName="Preco" min="0" [placeholder]="(null==dataId?null:dataId.preco)||'0,00'">
        </div>
        <div class="admin-campo">
          <label class="uz-rotulo">
            Estoque por tamanho
          </label>
          <div class="quantidade">
            <div class="setQuantidade" *ngFor="let tamanho of tamanhos">
              <label [for]="'qtd-'+tamanho.sigla">
                {{ tamanho.sigla }}
              </label>
              <button class="btn-decrease" type="button" aria-label="Diminuir" (click)="alterarQuantidade(tamanho.controle,-1)">
                -
              </button>
              <input class="quantidade-input" type="number" min="0" [id]="'qtd-'+tamanho.sigla" [formControlName]="tamanho.controle">
              <button class="btn-increase" type="button" aria-label="Aumentar" (click)="alterarQuantidade(tamanho.controle,1)">
                +
              </button>
            </div>
          </div>
        </div>
        <div class="admin-campo">
          <label class="uz-rotulo">
            Categoria
          </label>
          <mat-form-field appearance="outline">
            <mat-select placeholder="Selecione" [value]="selecionado" (valueChange)="selecionado=$event">
              <mat-option [value]="categoria.categoria" *ngFor="let categoria of categorias">
                {{ categoria.nomeCategoria }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="admin-campo">
          <label class="uz-rotulo" for="descricao">
            Descrição
          </label>
          <textarea id="descricao" formControlName="Descricao" [placeholder]="(null==dataId?null:dataId.descricao)||''"></textarea>
        </div>
        <div class="admin-acoes">
          <button class="uz-btn-vazado" type="button" (click)="voltarParaListar()">
            Cancelar
          </button>
          <button class="uz-btn-marca" type="submit" (click)="editarProduto()">
            Atualizar produto
          </button>
        </div>
      </form>
      <div class="admin-form" *ngIf="!listarProduto&&enviarFoto">
        <div class="grade-upload">
          <div class="file-upload-div upload-principal">
            <label for="file-upload1">
              <img alt="Pré-visualização" [src]="imageUrl1" *ngIf="imageUrl1">
              <ng-container *ngIf="!imageUrl1">
                +
              </ng-container>
            </label>
            <input type="file" id="file-upload1" accept="image/*" (change)="onFilesSelected($event,'file-upload1')">
          </div>
          <div class="file-upload-div upload-secundario">
            <label for="file-upload2">
              <img alt="Pré-visualização" [src]="imageUrl2" *ngIf="imageUrl2">
              <ng-container *ngIf="!imageUrl2">
                +
              </ng-container>
            </label>
            <input type="file" id="file-upload2" accept="image/*" (change)="onFilesSelected($event,'file-upload2')">
          </div>
          <div class="file-upload-div upload-secundario">
            <label for="file-upload3">
              <img alt="Pré-visualização" [src]="imageUrl3" *ngIf="imageUrl3">
              <ng-container *ngIf="!imageUrl3">
                +
              </ng-container>
            </label>
            <input type="file" id="file-upload3" accept="image/*" (change)="onFilesSelected($event,'file-upload3')">
          </div>
        </div>
        <p class="contador-fotos">
          {{ contadorFiles }} de 3 fotos selecionadas
        </p>
        <div class="admin-acoes">
          <button class="uz-btn-vazado" type="button" (click)="apagarTodas()">
            Limpar imagens
          </button>
          <button class="uz-btn-vazado" type="button" (click)="fotoClose()">
            Cancelar
          </button>
          <button class="uz-btn" type="button" (click)="salvar()">
            Salvar fotos
          </button>
        </div>
      </div>
    </section>
  </main>
</div>
