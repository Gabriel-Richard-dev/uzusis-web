<div>
  <div class="grid" id="fotosContainer" #fotosContainer>

    <div *ngFor="let produto of produtos">

      <div class="img" (click)="openDialog(produto)">
        <img [src]="produto.fotoUrls[0]" alt="{{produto.descricao}}">
        <h5>{{produto.nome}}</h5>
        <h2>R${{produto.preco}}</h2>
      </div>
    </div>
  </div>
  <button class="gerar" (click)="gerar()" *ngIf="hasMore; else messageTemplate">Carregar mais fotos</button>
  <ng-template #messageTemplate>
    <p class="text-center text-muted">Sem mais informações</p>
  </ng-template>
</div>
