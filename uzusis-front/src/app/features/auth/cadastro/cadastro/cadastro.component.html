<app-navbar />

<div class="escopo">
  <div class="content col-6">
    <h2 class="mt-3">Cadastre-se</h2>
    <p>Cadastre-se informando seus dados</p>
    <div class="container-border">
      <form class="mb-3" [formGroup]="formCadastrar" (ngSubmit)="onSubmit()">
   

        <div class="form-row">
          
          
          <div class="form-group col-md-6">
            <label for="email">Email</label>
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('email')?.invalid && formularioEnviarError}" 
            />
          </div>
          
          <div class="d-flex">
          <div class="form-group col-md-3">
            <label for="senha">Senha</label>
            <input 
              id="senha" 
              type="password" 
              formControlName="senha" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('senha')?.invalid && formularioEnviarError}" 
              placeholder="*****"
            />
          </div>

          <div class="form-group col-md-3">
            <label for="confirmarSenha">Confirmar Senha</label>
            <input 
              id="confirmarSenha" 
              type="password" 
              formControlName="confirmarSenha" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('confirmarSenha')?.invalid && formularioEnviarError}" 
              placeholder="*****"
            />
          </div>
        </div>
       
        </div>
        <div class="form-row">
    
          <div class="form-group col-md-6">
            <label for="nome">Nome</label>
            <input 
              id="nome" 
              formControlName="nome" 
              type="text" 
              class="form-control" 
              [ngClass]="{'invalid-field': formCadastrar.get('nome')?.invalid && formularioEnviarError}"
              placeholder="Ex: Igor Valente"
            />
          </div>




        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="cpf">CPF</label>
            <input 
              id="cpf" 
              formControlName="cpf" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('cpf')?.invalid && formularioEnviarError}" 
              placeholder="Ex: 234.153.987-98"
            />
          </div>

          <div class="form-group col-md-6">
            <label for="celular">Celular</label>
            <input 
              id="celular" 
              formControlName="celular" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('celular')?.invalid && formularioEnviarError}" 
              placeholder="dd xxxxxxxxxx"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="dataNascimento">Data de Nascimento</label>
            <input 
              type="date" 
              id="dataNascimento" 
              formControlName="dataNascimento" 
              class="form-control"
              [ngClass]="{'invalid-field': formCadastrar.get('dataNascimento')?.invalid && formularioEnviarError}" 
            />
          </div>
        </div>
      
        <fieldset>
          <legend>Endereço</legend>

          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="cep">CEP</label>
              <input 
                id="cep" 
                (keyup)="puxarEndereco()" 
                formControlName="cep" 
                maxlength="9"
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('cep')?.invalid && formularioEnviarError}" 
              />
            </div>

            <div class="form-group col-md-6">
              <label for="rua">Rua</label>
              <input 
                id="rua" 
                formControlName="rua" 
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('rua')?.invalid && formularioEnviarError}" 
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="numero">Número</label>
              <input 
                id="numero" 
                formControlName="numero" 
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('numero')?.invalid && formularioEnviarError}" 
              />
            </div>

            <div class="form-group col-md-4">
              <label for="bairro">Bairro</label>
              <input 
                id="bairro" 
                formControlName="bairro" 
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('bairro')?.invalid && formularioEnviarError}" 
              />
            </div>

            <div class="form-group col-md-4">
              <label for="cidade">Cidade</label>
              <input 
                id="cidade" 
                formControlName="cidade" 
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('cidade')?.invalid && formularioEnviarError}" 
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="estado">Estado</label>
              <input 
                id="estado" 
                formControlName="estado" 
                class="form-control"
                [ngClass]="{'invalid-field': formCadastrar.get('estado')?.invalid && formularioEnviarError}" 
              />
            </div>
          </div>
        </fieldset>


        <button  type="submit" class="btn btn-primary mt-3">Cadastrar</button>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
