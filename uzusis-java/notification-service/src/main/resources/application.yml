spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/notifications}
    username: ${DB_USER:notifications}
    password: ${DB_PASSWORD:notifications}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # Este serviço não tem tabela própria: só precisa do outbox e da
    # idempotência que vêm do common.
    locations: classpath:db/migration/common

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

  mail:
    host: ${EMAIL_SERVER:localhost}
    port: ${EMAIL_PORT:1025}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_AUTH:false}
          starttls:
            enable: ${EMAIL_TLS:false}

uzusis:
  email:
    remetente: ${EMAIL_FROM:nao-responda@uzusis.local}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
