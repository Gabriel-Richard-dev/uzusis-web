<app-navbar></app-navbar>
<div class="escopo">
  <header class="cabecalho">
    <h1>
      Identificação
    </h1>
    <p>
      Faça o seu login ou crie uma conta caso ainda não possua cadastro
    </p>
  </header>
  <div class="painel">
    <section class="uz-cartao bloco">
      <h2>
        Já sou cadastrado
      </h2>
      <form [formGroup]="formLogin">
        <div class="campo">
          <label class="uz-rotulo" for="loginEmail">
            Email
          </label>
          <input class="uz-campo" id="loginEmail" formControlName="email" type="email" autocomplete="email">
        </div>
        <div class="campo">
          <label class="uz-rotulo" for="loginSenha">
            Senha
          </label>
          <input class="uz-campo" id="loginSenha" formControlName="senha" type="password" autocomplete="current-password">
        </div>
        <button class="uz-btn largura-total" type="submit" (click)="logar()">
          Prosseguir
        </button>
        <a class="link-secundario" routerLink="/enviarEmail">
          Esqueceu sua senha?
        </a>
      </form>
    </section>
    <section class="uz-cartao bloco">
      <h2>
        Ainda não possuo cadastro
      </h2>
      <form [formGroup]="formEnviarEmail">
        <div class="campo">
          <label class="uz-rotulo" for="cadastroEmail">
            Digite o email que deseja cadastrar
          </label>
          <input class="uz-campo" id="cadastroEmail" formControlName="email" type="email" placeholder="voce@email.com" autocomplete="email">
        </div>
        <button class="uz-btn-marca largura-total" type="submit" (click)="enviarEmail()">
          Cadastrar
        </button>
        <p class="ajuda">
          Enviaremos um código de confirmação para esse endereço.
        </p>
      </form>
    </section>
  </div>
</div>
<app-footer></app-footer>
