
<div class="flex d-flex">
<app-sidebar></app-sidebar>

<div class="escopo">
  <div class="content col-6">
   <div class="container-border">
    <h1 style="color: black;">Cadastrar produto</h1>
    <form *ngIf="!enviarFoto"  action="" [formGroup]="criarProduto">
      
      <div style="width: 200px; height:  300px;" (click)="trocarParaOEnviarImagem()">
        AAAAAAAAAAAAAAAAAAAAAAAAAAA
      </div>
      
      
      <label for="">Crie um novo produto</label>
      <input type="text"  formControlName="Nome" placeholder="nome do produto" />
      <label for="">Preço de venda</label>
      <input type="number" formControlName="Preco"  placeholder="R$ 00,00"/>
      <label for="">Adicionar tamanhos</label>  
      <div class="quantidade d-flex">
      <div>
        <label for="">P</label>  
      <input type="number" formControlName="QuantidadeP"/>
    </div>
    <div>
      <label for="">M</label>    
      <input type="number" formControlName="QuantidadeM"/>
    </div>
    <div>
      <label for="">G</label>    
      <input type="number" formControlName="QuantidadeG"/>
    </div>
    </div>
    <mat-form-field style="width: 50%;">
      <mat-label>Categoria</mat-label>
      <mat-select [(value)]="selecionado">
        <mat-option *ngFor="let categoria of categorias" [value]="categoria.categoria">
          {{ categoria.nomeCategoria }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <input style="height: 100px;" type="text"  formControlName="Descricao" placeholder="Descricao" />



      <button type="submit" (click) = "cadastrarProduto()">click</button>
      </form>
<form  *ngIf="enviarFoto" action="">
<div class="box-images d-flex justify-content-center">
  <div>
  <div class="caixa-imagem-grande"><input (change) = "onFilesSelected($event)" type="file" formControlName="FotoFiles"/></div>
  <div style="gap: 20px;" class="d-flex mt-2">
  <div class="caixa-imagem"><input (change) = "onFilesSelected($event)" type="file" formControlName="FotoFiles"/></div>
  <div class="caixa-imagem"><input (change) = "onFilesSelected($event)" type="file" formControlName="FotoFiles"/></div>
  <form class="file-upload-div">
    <label for="file-upload">Escolher arquivo</label>
    <input type="file" id="file-upload" name = "file-upload">
    <img src="/src/assets/icons8-adicionar-50.png" alt="">
</form>

</div>
</div>
</div>
</form>

    </div>
  </div>
</div>
</div>
