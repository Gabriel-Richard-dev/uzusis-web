<div class="pilha-toasts" aria-live="polite">
  <div class="toast-uz" [class]="'toast-uz ' + item.tipo" *ngFor="let item of toasts$ | async">
    <span class="icone" aria-hidden="true">
      <ng-container *ngTemplateOutlet="icone; context: { $implicit: item.tipo }"></ng-container>
    </span>
    <div class="conteudo">
      <strong>{{ item.titulo }}</strong>
      <p *ngIf="item.texto">{{ item.texto }}</p>
    </div>
    <button class="fechar" type="button" aria-label="Fechar" (click)="fecharToast(item.id)">×</button>
  </div>
</div>

<div class="fundo-dialogo" *ngIf="dialogo$ | async as dialogo" (click)="dialogo.responder(false)">
  <div class="dialogo" role="alertdialog" (click)="$event.stopPropagation()">
    <span class="selo" [class]="'selo ' + dialogo.tipo" aria-hidden="true">
      <ng-container *ngTemplateOutlet="icone; context: { $implicit: dialogo.tipo }"></ng-container>
    </span>
    <h2>{{ dialogo.titulo }}</h2>
    <p *ngIf="dialogo.texto">{{ dialogo.texto }}</p>
    <div class="acoes">
      <button class="secundario" type="button" *ngIf="dialogo.cancelar" (click)="dialogo.responder(false)">
        {{ dialogo.cancelar }}
      </button>
      <button class="primario" type="button" (click)="dialogo.responder(true)">
        {{ dialogo.confirmar }}
      </button>
    </div>
  </div>
</div>

<ng-template #icone let-tipo>
  <svg *ngIf="tipo === 'sucesso'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5"></path>
  </svg>
  <svg *ngIf="tipo === 'erro'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18M6 6l12 12"></path>
  </svg>
  <svg *ngIf="tipo === 'aviso'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 9v5M12 17.5h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
  </svg>
</ng-template>
