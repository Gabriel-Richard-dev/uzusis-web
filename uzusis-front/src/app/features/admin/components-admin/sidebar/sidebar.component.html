<button class="admin-hamburguer" type="button" aria-label="Abrir menu do admin" [attr.aria-expanded]="aberta" (click)="aberta=!aberta">
  <span></span>
  <span></span>
  <span></span>
</button>
<div class="admin-overlay" (click)="aberta=false" *ngIf="aberta"></div>
<aside class="sidebar" [class.aberta]="aberta">
  <div class="marca">
    <img src="assets/circulo.png" alt="">
    <div>
      <strong>
        Uzusis
      </strong>
      <span>
        painel do admin
      </span>
    </div>
  </div>
  <nav>
    <a routerLinkActive="ativo" [routerLink]="iten.rota" (click)="aberta=false" *ngFor="let iten of itens">
      {{ iten.rotulo }}
    </a>
  </nav>
  <footer>
    <img class="logotipo" src="assets/logoUzu.png" alt="Uzusis">
    <button class="sair" type="button" (click)="logout()">
      <img src="assets/icons8-logout-50.png" alt="">
      <span>
        Sair
      </span>
    </button>
  </footer>
</aside>
