<app-navbar></app-navbar>
<div class="escopo">
  <header class="cabecalho">
    <h1>
      Recupere sua senha
    </h1>
    <p>
      Enviaremos um código para o e-mail cadastrado
    </p>
  </header>
  <section class="uz-cartao cartao">
    <form [formGroup]="formEnviarEmail">
      <h2>
        Não lembro minha senha
      </h2>
      <div class="campo">
        <label class="uz-rotulo" for="emailRecuperacao">
          E-mail da conta
        </label>
        <input class="uz-campo" id="emailRecuperacao" formControlName="email" type="email" placeholder="voce@email.com" autocomplete="email">
        <small class="uz-erro" *ngIf="(formEnviarEmail.get('email')?.invalid)&&(formEnviarEmail.get('email')?.touched)">
          Informe um e-mail válido.
        </small>
      </div>
      <button class="uz-btn-marca largura-total" type="submit" (click)="enviarEmailResetarSenha()">
        Enviar código
      </button>
      <a class="voltar" routerLink="/login">
        Voltar para o login
      </a>
    </form>
  </section>
</div>
<app-footer></app-footer>
