spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # A varredura recursiva já pega o db/migration/common/V0 do jar do common.
  flyway:
    locations: classpath:db/migration

  # Sem Accept-Language (curl, testes) o locale seria o da JVM, em inglês.
  web:
    locale: pt_BR
    locale-resolver: fixed

  data:
    web:
      pageable:
        serialization-mode: direct
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true

  # issuer-uri + jwk-set-uri: valida o iss sem discovery na URL pública, que
  # não é alcançável de dentro do contêiner. O serviço sobe sem o Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/auth/realms/uzusis}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/uzusis/protocol/openid-connect/certs}

uzusis:
  catalogo:
    base-url: ${CATALOG_URL:http://localhost:8082}
  pedido:
    expiracao-minutos: ${PEDIDO_EXPIRACAO_MINUTOS:30}
    varredura-ms: 60000
  frete:
    padrao: ${FRETE_PADRAO:40.00}
    por-uf: ${FRETE_POR_UF:CE=10.00}
  fuso: America/Fortaleza

resilience4j:
  retry:
    instances:
      catalogo:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      catalogo:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
