server {
    listen 80;
    root /usr/share/nginx/html;

    # Upload de fotos de produto passa por aqui.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
    }

    # Fotos no MinIO: a API devolve URLs com Minio__PublicBaseUrl=/storage.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
