<app-navbar></app-navbar>
<div class="hero">
  <ngb-carousel #carousel [interval]="5e3" [pauseOnHover]="pauseOnHover" [pauseOnFocus]="pauseOnFocus" (slide)="onSlide($event)">
    <ng-template ngbSlide *ngFor="let img of images">
      <div class="picsum-img-wrapper">
        <img src="assets/{{ img.name }}" [alt]="img.caption" />
      </div>
      <div class="carousel-caption" *ngIf="img.caption">
        <h3>{{ img.caption }}</h3>
      </div>
    </ng-template>
  </ngb-carousel>
</div>
<div class="escopo">
  <h1 class="title">
    Novidades
  </h1>
  <app-allfotos></app-allfotos>
</div>
<app-footer></app-footer>
