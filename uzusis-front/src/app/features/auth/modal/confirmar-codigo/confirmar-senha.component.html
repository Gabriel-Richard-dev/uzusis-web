<div class="modal-codigo">
  <button class="fechar" type="button" aria-label="Fechar" (click)="fechar()">
    ×
  </button>
  <div class="selo" aria-hidden="true">
    <img src="assets/email-svgrepo-com.svg" alt="">
  </div>
  <h2>
    Digite o código de verificação
  </h2>
  <p class="detalhe">
    Enviamos um código de {{ formInput.length }} dígitos para
    <strong *ngIf="email">
      {{ email }}
    </strong>
    <span *ngIf="!email">
      o seu e-mail
    </span>
  </p>
  <form [formGroup]="form" (paste)="colar($event)">
    <div class="digitos">
      <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" [formControlName]="campo" [attr.aria-label]="'Dígito '+(i+1)" (keyup)="keyUpEvent($event, i)" *ngFor="let campo of formInput; let i = index">
    </div>
    <button class="validar" type="button" (click)="enviarCodigoEmail()">
      Validar código
    </button>
  </form>
  <p class="reenviar">
    Não recebeu?
    <button type="button" (click)="reenviar()">
      Reenviar código
    </button>
  </p>
</div>
