spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/uzusis}

  cloud:
    gateway:
      default-filters:
        # O front chama /api/...; os serviços expõem /produtos, /carrinho etc.
        - StripPrefix=1
      routes:
        - id: catalog
          uri: ${CATALOG_URL:http://localhost:8082}
          predicates:
            - Path=/api/produtos/**

        - id: order
          uri: ${ORDER_URL:http://localhost:8083}
          predicates:
            - Path=/api/carrinho/**,/api/pedidos/**

        - id: payment
          uri: ${PAYMENT_URL:http://localhost:8084}
          predicates:
            - Path=/api/pagamentos/**,/api/webhooks/stripe

        - id: identity
          uri: ${IDENTITY_URL:http://localhost:8086}
          predicates:
            - Path=/api/perfil/**

        # Strangler fig: o que ainda não foi extraído continua indo para o
        # .NET. Some uma rota daqui a cada serviço migrado; quando esta rota
        # ficar vazia, o monolito pode ser desligado.
        - id: legado-dotnet
          uri: ${LEGACY_API_URL:http://api:8080}
          predicates:
            - Path=/api/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
