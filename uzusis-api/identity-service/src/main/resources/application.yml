spring:
  application:
    name: identity-service

  # Java 21: código bloqueante normal em virtual thread. Não vale reproduzir o
  # async/await do C# com CompletableFuture espalhado pelo código.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}

  jpa:
    open-in-view: false
    hibernate:
      # Schema só muda por Flyway, em todos os ambientes. validate falha o
      # start quando o código e o banco divergem — que é o que se quer saber
      # no deploy, não no primeiro request.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Tudo em UTC no banco; conversão só na apresentação.
          time_zone: UTC

  flyway:
    # Uma location só: a varredura é recursiva e já pega o db/migration/common/V0
    # do jar do common. Com as duas, o V0 aparece duas vezes e o boot falha.
    locations: classpath:db/migration

  # Sem Accept-Language (curl, testes) o resolver padrão usaria o locale da JVM.
  web:
    locale: pt_BR
    locale-resolver: fixed

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/auth/realms/uzusis}
          # JWKS pela rede interna: o issuer é a URL pública, inalcançável de dentro do contêiner.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/uzusis/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
