spring:
  application:
    name: catalog-service

  # Java 21: código bloqueante normal em virtual thread. Não vale reproduzir o
  # async/await do C# com CompletableFuture espalhado pelo código.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}

  jpa:
    open-in-view: false
    hibernate:
      # Schema só muda por Flyway, em todos os ambientes. validate falha o
      # start quando o código e o banco divergem — que é o que se quer saber
      # no deploy, não no primeiro request.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Tudo em UTC no banco; conversão só na apresentação.
          time_zone: UTC

  flyway:
    # Uma location só: a varredura é recursiva e já acha o V0 em
    # db/migration/common, no jar do common. Com as duas, o Flyway vê o V0
    # duas vezes e recusa o boot.
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Sem auto-commit: o offset avança depois do handler, senão uma falha
      # perde o evento em silêncio.
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      # Propaga o trace ID pelos headers do Kafka. Sem isso, depurar saga
      # distribuída é adivinhação.
      observation-enabled: true
    template:
      observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # O iss é a URL pública; as chaves vêm pela rede interna, sem
          # discovery na URL pública (inalcançável de dentro do contêiner).
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/auth/realms/uzusis}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/uzusis/protocol/openid-connect/certs}

  web:
    # Sem Accept-Language (curl, testes) o resolver padrão usaria o locale da
    # JVM, em inglês.
    locale: pt_BR
    locale-resolver: fixed

  data:
    web:
      pageable:
        serialization-mode: direct
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    # O padrão (2 MB) fecha a conexão com o corpo não lido: um upload de 6 a
    # 8 MB viraria reset ou 502 em vez do 413 em pt-BR.
    max-swallow-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

uzusis:
  kafka:
    # Compensação da saga: retentada sem limite, nunca para a DLQ (KafkaErrorHandlerConfig).
    compensacoes: order.order.cancelled.v1
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:uzusis}
    secret-key: ${MINIO_SECRET_KEY:uzusis-minio-dev}
    bucket: ${MINIO_BUCKET:produtos}
    # URL gravada: {public-prefix}/{bucket}/{chave}; o nginx serve /storage.
    public-prefix: ${MINIO_PUBLIC_PREFIX:/storage}
