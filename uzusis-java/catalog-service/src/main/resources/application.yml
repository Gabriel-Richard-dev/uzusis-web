spring:
  application:
    name: catalog-service

  # Java 21: código bloqueante normal em virtual thread. Não vale reproduzir o
  # async/await do C# com CompletableFuture espalhado pelo código.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}

  jpa:
    open-in-view: false
    hibernate:
      # Schema só muda por Flyway, em todos os ambientes. validate falha o
      # start quando o código e o banco divergem — que é o que se quer saber
      # no deploy, não no primeiro request.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Tudo em UTC no banco; conversão só na apresentação.
          time_zone: UTC

  flyway:
    locations: classpath:db/migration,classpath:db/migration/common

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Sem auto-commit: o offset avança depois do handler, senão uma falha
      # perde o evento em silêncio.
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      # Propaga o trace ID pelos headers do Kafka. Sem isso, depurar saga
      # distribuída é adivinhação.
      observation-enabled: true
    template:
      observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/uzusis}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
