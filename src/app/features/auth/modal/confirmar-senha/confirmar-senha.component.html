<div class="container-fluid">
    <form [formGroup]="form">
    <h3> Digite seu codigo </h3>
    <div class="row">
    <div class="form-group col-sm-2 d-flex justify-content-center" *ngFor="let input of formInput;  index as i">
        <input #formRow type="text" formControlName="{{input}}" class="form-control" maxlength="1" (keyup)="keyUpEvent($event, i)">
    </div>
    </div>
    </form>
    </div>
